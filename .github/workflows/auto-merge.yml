name: Queue trusted pull requests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [labeled]

# This workflow runs from the default branch after CI completes. It never
# checks out pull-request code, so the write token is not exposed to untrusted
# workflow changes from forks.
permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    name: Queue eligible PRs
    if: >-
      ${{ github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge or queue trusted pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: run.head_sha },
            );

            for (const pull of associated) {
              const headRepo = pull.head?.repo?.full_name;
              const author = pull.user?.login;
              const trustedAuthor = author === 'TPB003' || author === 'dependabot[bot]';
              const optedOut = pull.labels?.some((label) =>
                ['no-auto-merge', 'do-not-merge'].includes(label.name),
              );

              if (
                pull.state !== 'open' ||
                pull.base?.ref !== 'main' ||
                pull.draft ||
                headRepo !== `${owner}/${repo}` ||
                !trustedAuthor ||
                optedOut
              ) {
                core.info(`Skipping PR #${pull.number}: not eligible for automatic merge`);
                continue;
              }

              const details = await github.rest.pulls.get({ owner, repo, pull_number: pull.number });
              if (details.data.head.sha !== run.head_sha) {
                core.info(`Skipping PR #${pull.number}: CI result is for an older commit`);
                continue;
              }

              if (details.data.mergeable_state === 'clean') {
                const merged = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pull.number,
                  sha: run.head_sha,
                  merge_method: 'squash',
                });
                if (!merged.data.merged) {
                  core.setFailed(`Unable to merge PR #${pull.number}: ${merged.data.message ?? 'merge was not completed'}`);
                } else {
                  core.info(`Merged PR #${pull.number} after successful CI`);
                }
                continue;
              }

              try {
                await github.graphql(
                  `mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: pull.node_id },
                );
                core.info(`Auto-merge enabled for PR #${pull.number}`);
              } catch (error) {
                const refreshed = await github.rest.pulls.get({ owner, repo, pull_number: pull.number });
                if (refreshed.data.head.sha === run.head_sha && refreshed.data.mergeable_state === 'clean') {
                  const merged = await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: pull.number,
                    sha: run.head_sha,
                    merge_method: 'squash',
                  });
                  if (!merged.data.merged) {
                    core.setFailed(`Unable to merge PR #${pull.number}: ${merged.data.message ?? error.message}`);
                  } else {
                    core.info(`Merged PR #${pull.number} after auto-merge became clean`);
                  }
                } else {
                  core.setFailed(`Unable to enable auto-merge for PR #${pull.number}: ${error.message}`);
                }
              }
            }

  disable-opt-out:
    name: Disable auto-merge after opt-out label
    if: >-
      ${{ github.event_name == 'pull_request' &&
      github.event.action == 'labeled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge for opted-out pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const label = context.payload.label?.name;
            const optedOutLabels = ['no-auto-merge', 'do-not-merge'];

            if (!optedOutLabels.includes(label)) {
              core.info(`Ignoring label ${label ?? '(none)'}`);
              return;
            }

            const trustedAuthor = ['TPB003', 'dependabot[bot]'].includes(pull.user?.login);
            const sameRepository = pull.head?.repo?.full_name === `${owner}/${repo}`;
            if (pull.base?.ref !== 'main' || !trustedAuthor || !sameRepository) {
              core.info(`Skipping auto-merge disable for PR #${pull.number}: untrusted or external head`);
              return;
            }

            try {
              await github.graphql(
                `mutation DisableAutoMerge($pullRequestId: ID!) {
                  disablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId }) {
                    pullRequest { number }
                  }
                }`,
                { pullRequestId: pull.node_id },
              );
              core.info(`Auto-merge disabled for PR #${pull.number}`);
            } catch (error) {
              core.setFailed(`Unable to disable auto-merge for PR #${pull.number}: ${error.message}`);
            }
